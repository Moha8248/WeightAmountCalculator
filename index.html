<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weight Price Calculator</title>

  <style>
    :root{
      --bg:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card:#ffffff;
      --primary:#667eea;
      --primary-dark:#5568d3;
      --secondary:#764ba2;
      --success:#10b981;
      --danger:#ef4444;
      --warning:#f59e0b;
      --text:#1f2937;
      --text-light:#6b7280;
      --border:#e5e7eb;
      --shadow:0 20px 40px rgba(0,0,0,0.12);
      --shadow-lg:0 25px 50px rgba(102,126,234,0.15);
    }

    body.dark{
      --bg:linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      --card:#0f3460;
      --text:#f9fafb;
      --text-light:#d1d5db;
      --border:#374151;
      --shadow:0 20px 40px rgba(0,0,0,0.3);
      --shadow-lg:0 25px 50px rgba(102,126,234,0.25);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      transition:all 0.4s ease;
    }

    .card{
      width:100%;
      max-width:520px;
      background:var(--card);
      padding:40px;
      border-radius:32px;
      box-shadow:var(--shadow-lg);
      backdrop-filter:blur(10px);
      animation:slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:32px;
      padding-bottom:24px;
      border-bottom:2px solid var(--border);
    }

    h1{
      font-size:32px;
      font-weight:800;
      background:linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      letter-spacing:-0.5px;
    }

    .dark-btn{
      border:none;
      background:var(--primary);
      color:#fff;
      padding:12px 18px;
      border-radius:16px;
      cursor:pointer;
      font-size:16px;
      font-weight:600;
      transition:all 0.3s ease;
      box-shadow:0 4px 15px rgba(102,126,234,0.3);
    }

    .dark-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 6px 20px rgba(102,126,234,0.4);
    }

    .dark-btn:active{
      transform:translateY(0);
    }

    .field{
      margin-bottom:24px;
    }

    label{
      display:block;
      margin-bottom:10px;
      font-weight:700;
      font-size:15px;
      color:var(--text);
      text-transform:uppercase;
      letter-spacing:0.5px;
    }

    input{
      width:100%;
      padding:16px 18px;
      border-radius:16px;
      border:2px solid var(--border);
      font-size:16px;
      outline:none;
      background:var(--card);
      color:var(--text);
      transition:all 0.3s ease;
      font-weight:500;
    }

    input:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 5px rgba(102,126,234,0.1), 0 0 0 2px var(--primary);
      background:var(--card);
    }

    input::placeholder{
      color:var(--text-light);
    }

    .rate-box{
      display:flex;
      gap:12px;
    }

    .store-btn{
      border:none;
      background:linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color:white;
      padding:16px 24px;
      border-radius:16px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
      transition:all 0.3s ease;
      box-shadow:0 4px 15px rgba(102,126,234,0.3);
      flex-shrink:0;
    }

    .store-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 6px 20px rgba(102,126,234,0.4);
    }

    .store-btn:active{
      transform:translateY(0);
    }

    .result-box{
      margin-top:32px;
      background:linear-gradient(135deg, rgba(102,126,234,0.08) 0%, rgba(118,75,162,0.08) 100%);
      border:2px solid var(--primary);
      border-radius:24px;
      padding:28px;
      box-shadow:0 8px 24px rgba(102,126,234,0.12);
      transition:all 0.3s ease;
    }

    .result-box:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 32px rgba(102,126,234,0.18);
    }

    body.dark .result-box{
      background:linear-gradient(135deg, rgba(102,126,234,0.15) 0%, rgba(118,75,162,0.12) 100%);
      border:2px solid rgba(102,126,234,0.5);
    }

    .result-item{
      margin-bottom:24px;
      padding-bottom:24px;
      border-bottom:1px solid var(--border);
    }

    .result-item:last-child{
      margin-bottom:0;
      padding-bottom:0;
      border-bottom:none;
    }

    .result-label{
      font-size:13px;
      margin-bottom:12px;
      opacity:0.7;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:0.5px;
      color:var(--text-light);
    }

    .result-value{
      font-size:42px;
      font-weight:800;
      word-break:break-word;
      background:linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }

    .buttons{
      display:flex;
      gap:14px;
      margin-top:28px;
    }

    button.action{
      flex:1;
      border:none;
      padding:16px;
      border-radius:16px;
      cursor:pointer;
      font-size:16px;
      font-weight:700;
      transition:all 0.3s ease;
      text-transform:uppercase;
      letter-spacing:0.5px;
      box-shadow:0 4px 15px rgba(0,0,0,0.1);
    }

    button.action:hover{
      transform:translateY(-2px);
      box-shadow:0 6px 20px rgba(0,0,0,0.15);
    }

    button.action:active{
      transform:translateY(0);
    }

    .reset{
      background:linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color:white;
    }

    .save{
      background:linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color:white;
    }

    .history{
      margin-top:36px;
      padding-top:28px;
      border-top:2px solid var(--border);
    }

    .history h3{
      margin-bottom:20px;
      font-size:18px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:0.5px;
      color:var(--text);
    }

    .history-item{
      background:linear-gradient(135deg, rgba(102,126,234,0.06) 0%, rgba(118,75,162,0.06) 100%);
      padding:18px;
      border-radius:16px;
      margin-bottom:14px;
      line-height:1.8;
      font-size:14px;
      border-left:4px solid var(--primary);
      transition:all 0.3s ease;
      cursor:pointer;
    }

    .history-item:hover{
      transform:translateX(4px);
      background:linear-gradient(135deg, rgba(102,126,234,0.12) 0%, rgba(118,75,162,0.12) 100%);
      box-shadow:0 4px 12px rgba(102,126,234,0.15);
    }

    .history-item strong{
      color:var(--primary);
      font-weight:700;
      text-transform:uppercase;
      font-size:12px;
      letter-spacing:0.3px;
    }

    .empty{
      opacity:0.6;
      font-size:14px;
      text-align:center;
      padding:20px;
      color:var(--text-light);
    }

    @media(max-width:480px){

      .card{
        padding:24px;
      }

      h1{
        font-size:26px;
      }

      .result-value{
        font-size:36px;
      }

      .rate-box{
        flex-direction:column;
      }

      .store-btn{
        width:100%;
        padding:16px;
      }

      .buttons{
        flex-direction:column;
      }

      button.action{
        width:100%;
      }

      .top{
        flex-direction:column;
        gap:12px;
        align-items:flex-start;
      }

      .dark-btn{
        width:100%;
      }
    }

  </style>
</head>

<body>

  <div class="card">

    <div class="top">
      <h1>💰 Price Calculator</h1>

      <button class="dark-btn" id="darkBtn">
        🌙 Dark
      </button>
    </div>

    <div class="field">

      <label>⚙️ 1 KG Rate (Base Price)</label>

      <div class="rate-box">

        <input
          type="number"
          id="rate"
          placeholder="Enter 1 KG rate"
          min="0"
          step="0.01"
        />

        <button id="storeRateBtn" class="store-btn">
          💾 Store
        </button>

      </div>

    </div>

    <div class="field">

      <label>⚖️ Weight (Gram)</label>

      <input
        type="number"
        id="weight"
        placeholder="Enter weight in gram"
        min="0"
        step="0.01"
      />

    </div>

    <div class="field">

      <label>💵 Amount (Price)</label>

      <input
        type="number"
        id="amount"
        placeholder="Enter amount"
        min="0"
        step="0.01"
      />

    </div>

    <div class="result-box">

      <div class="result-item">

        <div class="result-label">
          📊 Calculated Weight
        </div>

        <div class="result-value" id="weightDisplay">
          0.00 Gram
        </div>

      </div>

      <div class="result-item">

        <div class="result-label">
          💰 Calculated Amount
        </div>

        <div class="result-value" id="amountDisplay">
          0.00
        </div>

      </div>

    </div>

    <div class="buttons">

      <button class="action reset" id="resetBtn">
        🔄 Reset
      </button>

      <button class="action save" id="saveBtn">
        ✅ Save
      </button>

    </div>

    <div class="history">

      <h3>📝 Recent Calculations</h3>

      <div id="historyList"></div>

    </div>

  </div>

  <script>

    const rateInput = document.getElementById("rate");
    const weightInput = document.getElementById("weight");
    const amountInput = document.getElementById("amount");

    const weightDisplay = document.getElementById("weightDisplay");
    const amountDisplay = document.getElementById("amountDisplay");

    const resetBtn = document.getElementById("resetBtn");
    const saveBtn = document.getElementById("saveBtn");

    const historyList = document.getElementById("historyList");

    const darkBtn = document.getElementById("darkBtn");

    const storeRateBtn =
      document.getElementById("storeRateBtn");

    // Load saved rate
    window.addEventListener("load", () => {

      const savedRate =
        localStorage.getItem("savedRate");

      if(savedRate){
        rateInput.value = savedRate;
      }

      loadHistory();

    });

    function format(value){
      return Number(value).toFixed(2);
    }

    function isValid(value){

      return value !== "" &&
             !isNaN(value) &&
             Number(value) >= 0;

    }

    // Store 1 KG Rate
    storeRateBtn.addEventListener("click", () => {

      if(!isValid(rateInput.value)){

        alert("⚠️ Please enter a valid 1 KG rate");

        return;
      }

      localStorage.setItem(
        "savedRate",
        rateInput.value
      );

      alert("✅ 1 KG Rate Stored Successfully!");

    });

    // Weight -> Amount
    function calculateAmount(){

      const rate =
        parseFloat(rateInput.value);

      const weightGram =
        parseFloat(weightInput.value);

      if(
        isValid(rate) &&
        isValid(weightGram)
      ){

        // Gram to KG
        const weightKg =
          weightGram / 1000;

        const amount =
          weightKg * rate;

        amountInput.value =
          format(amount);

        amountDisplay.textContent =
          format(amount);

        weightDisplay.textContent =
          format(weightGram) + " Gram";

      }

    }

    // Amount -> Weight
    function calculateWeight(){

      const rate =
        parseFloat(rateInput.value);

      const amount =
        parseFloat(amountInput.value);

      if(
        isValid(rate) &&
        isValid(amount) &&
        rate > 0
      ){

        // KG
        const weightKg =
          amount / rate;

        // KG to Gram
        const weightGram =
          weightKg * 1000;

        weightInput.value =
          format(weightGram);

        weightDisplay.textContent =
          format(weightGram) + " Gram";

        amountDisplay.textContent =
          format(amount);

      }

    }

    // Real-time calculation
    weightInput.addEventListener(
      "input",
      calculateAmount
    );

    amountInput.addEventListener(
      "input",
      calculateWeight
    );

    // Reset
    resetBtn.addEventListener("click", () => {

      weightInput.value = "";
      amountInput.value = "";

      weightDisplay.textContent =
        "0.00 Gram";

      amountDisplay.textContent =
        "0.00";

    });

    // Save calculation
    saveBtn.addEventListener("click", () => {

      if(
        !rateInput.value ||
        !weightInput.value ||
        !amountInput.value
      ){

        alert("⚠️ Please complete calculation first");

        return;
      }

      const history =
        JSON.parse(
          localStorage.getItem("calcHistory")
        ) || [];

      history.unshift({

        rate: format(rateInput.value),

        weight:
          format(weightInput.value),

        amount:
          format(amountInput.value)

      });

      // Limit 5 history
      if(history.length > 5){
        history.pop();
      }

      localStorage.setItem(
        "calcHistory",
        JSON.stringify(history)
      );

      alert("✅ Calculation Saved Successfully!");

      loadHistory();

    });

    // Load history
    function loadHistory(){

      const history =
        JSON.parse(
          localStorage.getItem("calcHistory")
        ) || [];

      historyList.innerHTML = "";

      if(history.length === 0){

        historyList.innerHTML =
          "<div class='empty'>📭 No saved calculations yet</div>";

        return;
      }

      history.forEach((item, index) => {

        const div =
          document.createElement("div");

        div.className =
          "history-item";

        div.innerHTML = `

          <strong>💵 Rate:</strong>
          ${item.rate} / KG
          <br>

          <strong>⚖️ Weight:</strong>
          ${item.weight} Gram
          <br>

          <strong>💰 Amount:</strong>
          ${item.amount}

        `;

        historyList.appendChild(div);

      });

    }

    // Dark mode
    darkBtn.addEventListener("click", () => {

      document.body.classList.toggle("dark");

      if(
        document.body.classList.contains("dark")
      ){

        darkBtn.innerHTML =
          "☀️ Light";

      } else {

        darkBtn.innerHTML =
          "🌙 Dark";

      }

    });

  </script>

</body>
</html>
